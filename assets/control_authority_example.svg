<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" role="img"><title>Functional authority example</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#21758a"/></marker></defs><rect width="1100" height="420" fill="#f5f8fa"/><text x="55" y="52" font-family="sans-serif" font-size="28" font-weight="700" fill="#173443">A pressure constraint changes functional authority</text><text x="55" y="84" font-family="sans-serif" font-size="15" fill="#425b68">SYNTHETIC TEACHING EVENT • No pressure threshold, valve position or safety determination is inferred.</text><rect x="90" y="150" width="350" height="140" rx="14" fill="white" stroke="#21758a" stroke-width="2"/><text x="265" y="192" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#173443">Normal teaching state</text><text x="265" y="235" text-anchor="middle" font-family="monospace" font-size="17" fill="#173443">fuel_demand_control</text><line x1="455" y1="220" x2="645" y2="220" stroke="#21758a" stroke-width="4" marker-end="url(#a)"/><text x="550" y="200" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#425b68">constraint event</text><rect x="660" y="150" width="350" height="140" rx="14" fill="white" stroke="#d58037" stroke-width="2"/><text x="835" y="192" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#173443">Pressure-constraint state</text><text x="835" y="235" text-anchor="middle" font-family="monospace" font-size="17" fill="#173443">low_pressure_constraint</text><text x="550" y="350" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#425b68">Reference physical flows remain unchanged in this static functional example.</text></svg>