<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img"><title>Six-zone firing redistribution</title><rect width="1100" height="500" fill="#f5f8fa"/><text x="55" y="52" font-family="sans-serif" font-size="28" font-weight="700" fill="#173443">Redistribution changes location, not total inlet duty</text><text x="55" y="84" font-family="sans-serif" font-size="15" fill="#425b68">SYNTHETIC TEACHING CASE • Inlet total = 36 MW before and after • No temperature-to-firing gain.</text><line x1="90" y1="400" x2="1030" y2="400" stroke="#aac4cf"/><g font-family="sans-serif" font-size="15" fill="#173443" text-anchor="middle"><text x="160" y="430">A</text><text x="310" y="430">B</text><text x="460" y="430">C</text><text x="610" y="430">D</text><text x="760" y="430">E</text><text x="910" y="430">F</text></g><g fill="#8eabb8"><rect x="115" y="190" width="42" height="210"/><rect x="265" y="190" width="42" height="210"/><rect x="415" y="190" width="42" height="210"/><rect x="565" y="190" width="42" height="210"/><rect x="715" y="190" width="42" height="210"/><rect x="865" y="190" width="42" height="210"/></g><g fill="#21758a"><rect x="162" y="198" width="42" height="202"/><rect x="312" y="198" width="42" height="202"/><rect x="462" y="152" width="42" height="248"/><rect x="612" y="198" width="42" height="202"/><rect x="762" y="198" width="42" height="202"/><rect x="912" y="198" width="42" height="202"/></g><rect x="700" y="105" width="18" height="18" fill="#8eabb8"/><text x="728" y="120" font-family="sans-serif" font-size="15" fill="#173443">Balanced 6.00 MW</text><rect x="865" y="105" width="18" height="18" fill="#21758a"/><text x="893" y="120" font-family="sans-serif" font-size="15" fill="#173443">After correction</text><text x="460" y="145" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#173443">7.08 MW</text></svg>