<text x="296" y="208" text-anchor="middle" font-family="sans-serif" font-size="22" fill="white" font-weight="700">Radiant</text>
<text x="296" y="236" text-anchor="middle" font-family="sans-serif" font-size="19" fill="white">27.00 MW</text>
<text x="740" y="208" text-anchor="middle" font-family="sans-serif" font-size="22" fill="white" font-weight="700">Convection</text>
<text x="740" y="236" text-anchor="middle" font-family="sans-serif" font-size="19" fill="white">28.51 MW</text>
<text x="999" y="288" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#425b68">Stack 3.89 MW</text>
<text x="1040" y="315" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#425b68">Other 0.60 MW</text>

<line x1="80" y1="340" x2="1040" y2="340" stroke="#aac4cf" stroke-width="2"/>
<text x="80" y="367" font-family="sans-serif" font-size="14" fill="#425b68">0</text>
<text x="392" y="367" font-family="sans-serif" font-size="14" fill="#425b68">20</text>
<text x="712" y="367" font-family="sans-serif" font-size="14" fill="#425b68">40</text>
<text x="1015" y="367" font-family="sans-serif" font-size="14" fill="#425b68">60 MW</text>

<text x="80" y="415" font-family="sans-serif" font-size="18" fill="#173443">Useful heat = 55.51 MW • Overall efficiency = 92.52%</text>
<text x="80" y="440" font-family="sans-serif" font-size="14" fill="#425b68">Stack loss uses an effective flue-gas heat capacity and the difference between stack and ambient temperature.</text>
