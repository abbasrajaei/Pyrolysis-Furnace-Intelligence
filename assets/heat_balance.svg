<text x="60" y="92" font-family="sans-serif" font-size="16" fill="#425b68">PUBLIC TEACHING CASE • 60 MW fired duty • lumped furnace energy balance</text>

<rect x="80" y="165" width="432" height="92" fill="#d58a2f"/>
<rect x="512" y="165" width="456" height="92" fill="#21758a"/>
<rect x="968" y="165" width="62" height="92" fill="#8eabb8"/>
