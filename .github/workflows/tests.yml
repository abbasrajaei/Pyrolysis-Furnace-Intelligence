name: Public engineering tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  public-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install ".[test]"
      - run: python -m pytest -q
      - run: python examples/all_scenarios.py
      - run: python examples/fuel_comparison.py
      - run: pyrolysis-demo --scenario zone_temperature
